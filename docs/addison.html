<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Calendar | Floriano Family Sports</title>

<link rel="stylesheet" href="css/styles.css">
</head>
    
<body>
      
<header class="page-header">

    <a class="back" href="index.html">← Home</a>

    <img src="assets/logos/shield.png" class="shield small">

    <h1>Family Calendar</h1>

    <p>Everything in one place.</p>

</header>

<section id="subscribe">

    <a
        class="subscribe-button"
        href="https://calendar.google.com/calendar/ical/571551bd31f9314f7a0a70c01d74605b594b4bc6c5951d8d72657c53c268e6a1%40group.calendar.google.com/public/basic.ics">

        📅 Subscribe to Family Calendar

        <small>
            Google • Apple • Outlook
        </small>

    </a>

</section>

<section class="filters">

    <button class="filter active" data-athlete="ALL">
        <span class="dot"></span>
        All
    </button>

    <button class="filter" data-athlete="ADDISON">
        <span class="dot"></span>
        Addison
    </button>

    <button class="filter" data-athlete="RYLEY">
        <span class="dot"></span>
        Ryley
    </button>

</section>

<main class="schedule">

    <section id="today"></section>

    <section class="next-up"></section>

    <section id="week"></section>

</main>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/ffs.js"></script>
<script src="js/geocode.js"></script>
<script src="js/weather.js"></script>
<script src="js/maps.js"></script>
 <script>
const DASHBOARD = "addison";
</script>
<script src="js/family.js"></script>
</body>

</html>
